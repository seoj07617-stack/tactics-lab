<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>TacticLab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9.2"/>
      <path d="M12 6.2l4.6 3.3-1.8 5.4H9.2L7.4 9.5z"/>
      <path d="M12 6.2V3.4M16.6 9.5l2.9-.9M14.8 14.9l2 2.9M9.2 14.9l-2 2.9M7.4 9.5l-2.9-.9"/>
    </svg>
    <div class="brand-text"><b>TacticLab</b></div>
  </div>
  <div class="top-actions">
    <div class="seg seg-sm hidden" id="gtSeg">
      <button data-gt="futsal">五人制</button>
      <button data-gt="field8">八人制</button>
    </div>
    <button class="tool-btn" id="savedBtn" title="我的收藏">
      <span data-ic="saved"></span><i id="savedCount">0</i>
    </button>
  </div>
</header>

<div class="workspace" id="workspace">
  <nav class="rail" id="rail" aria-label="主导航">
    <button class="rail-item is-active" data-view="tactics"><span class="rail-ic" data-ic="studio"></span><span>战术</span></button>
    <button class="rail-item" data-view="formations"><span class="rail-ic" data-ic="formations"></span><span>阵型</span></button>
    <button class="rail-item" data-view="sessions"><span class="rail-ic" data-ic="sessions"></span><span>训练课</span></button>
    <button class="rail-item" data-view="saved"><span class="rail-ic" data-ic="saved"></span><span>收藏</span></button>
    <button class="rail-item" data-view="about"><span class="rail-ic" data-ic="about"></span><span>依据</span></button>
  </nav>

  <main class="stage">
    <section class="canvas" id="canvas" aria-live="polite"></section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="主导航">
  <button class="tab-item is-active" data-view="tactics"><span class="rail-ic" data-ic="studio"></span><span>战术</span></button>
  <button class="tab-item" data-view="formations"><span class="rail-ic" data-ic="formations"></span><span>阵型</span></button>
  <button class="tab-item" data-view="sessions"><span class="rail-ic" data-ic="sessions"></span><span>训练课</span></button>
  <button class="tab-item" data-view="saved"><span class="rail-ic" data-ic="saved"></span><span>收藏</span></button>
  <button class="tab-item" data-view="about"><span class="rail-ic" data-ic="about"></span><span>依据</span></button>
</nav>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/pitch.js"></script>
<script src="js/app.js"></script>
</body>
</html>
